<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="900" fill="#F8FAFC"/>
  <rect width="1400" height="12" fill="#051547"/>
  <text x="72" y="92" fill="#212121" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">eInvoice Light-Mode Color Palette</text>
  <text x="72" y="130" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="22">Semantic tokens for consistent portal UI</text>

  <g transform="translate(72 180)">
    <text x="0" y="0" fill="#212121" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Brand And Interaction</text>
    <g transform="translate(0 38)"><rect width="280" height="180" rx="24" fill="#051547"/><text x="24" y="82" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">#051547</text><text x="24" y="128" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Shell background</text><text x="24" y="156" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="18">navy-950</text></g>
    <g transform="translate(320 38)"><rect width="280" height="180" rx="24" fill="#0B1E59"/><text x="24" y="82" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">#0B1E59</text><text x="24" y="128" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Primary</text><text x="24" y="156" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="18">primary action</text></g>
    <g transform="translate(640 38)"><rect width="280" height="180" rx="24" fill="#2C4E86"/><text x="24" y="82" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">#2C4E86</text><text x="24" y="128" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Secondary</text><text x="24" y="156" fill="#DBEAFE" font-family="Arial, Helvetica, sans-serif" font-size="18">active tab</text></g>
    <g transform="translate(960 38)"><rect width="280" height="180" rx="24" fill="#337AB7"/><text x="24" y="82" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">#337AB7</text><text x="24" y="128" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Link / Focus</text><text x="24" y="156" fill="#DBEAFE" font-family="Arial, Helvetica, sans-serif" font-size="18">underlined links</text></g>
  </g>

  <g transform="translate(72 488)">
    <text x="0" y="0" fill="#212121" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Surfaces, Text And Status</text>
    <g transform="translate(0 38)"><rect width="280" height="180" rx="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/><text x="24" y="82" fill="#212121" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">#FFFFFF</text><text x="24" y="128" fill="#212121" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Surface</text><text x="24" y="156" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="18">cards and inputs</text></g>
    <g transform="translate(320 38)"><rect width="280" height="180" rx="24" fill="#212121"/><text x="24" y="82" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">#212121</text><text x="24" y="128" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Text</text><text x="24" y="156" fill="#D1D5DB" font-family="Arial, Helvetica, sans-serif" font-size="18">body and headings</text></g>
    <g transform="translate(640 38)"><rect width="280" height="180" rx="24" fill="#3C763D"/><text x="24" y="82" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">#3C763D</text><text x="24" y="128" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Success</text><text x="24" y="156" fill="#D1FAE5" font-family="Arial, Helvetica, sans-serif" font-size="18">completed status</text></g>
    <g transform="translate(960 38)"><rect width="280" height="180" rx="24" fill="#B22222"/><text x="24" y="82" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">#B22222</text><text x="24" y="128" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Error</text><text x="24" y="156" fill="#FEE2E2" font-family="Arial, Helvetica, sans-serif" font-size="18">validation and rejection</text></g>
  </g>
</svg>
